<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Hafızlık</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: one quiet paper column; each day is a single emerald "cover" card framed by gold cetvel rules, and the 30×20 page map is the signature view. */
:root{
  --paper:#F1F4EE;--sheet:#FAFCF8;--ink:#16211B;--ink-2:#55635A;--rule:#D8DFD4;
  --cell:#DFE6DB;--leaf:#2D7754;--on-leaf:#FFFFFF;--review:#E0C374;--gold:#A27618;--gold-ink:#86600F;
  --emerald-ink:#17493A;--cover:#17493A;--on-cover:#EEF3EC;--on-cover-2:#B7CABE;--gold-hi:#E2BC62;--on-gold:#1B261E;
  --cover-field:rgba(255,255,255,.09);--cetvel:rgba(226,188,98,.55);--cetvel-2:rgba(226,188,98,.22);
  --danger:#A13A2A;--on-danger:#FFFFFF;--scrim:rgba(14,22,18,.45);
  --shadow:0 1px 2px rgba(22,33,27,.06),0 10px 30px rgba(22,33,27,.09);
  --f-display:"Alegreya","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-arabic:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1511;--sheet:#131E18;--ink:#E4EBE4;--ink-2:#98A79D;--rule:#24322A;
  --cell:#1B2821;--leaf:#4BAA7F;--on-leaf:#0B140F;--review:#7C6631;--gold:#D5AA4E;--gold-ink:#DDB55E;
  --emerald-ink:#7FCFA6;--cover:#174D3B;--on-cover:#EEF3EC;--on-cover-2:#A9C2B4;--gold-hi:#E7C470;--on-gold:#1B261E;
  --cover-field:rgba(255,255,255,.08);--cetvel:rgba(231,196,112,.5);--cetvel-2:rgba(231,196,112,.2);
  --danger:#E5806B;--on-danger:#1F0E0A;--scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1511;--sheet:#131E18;--ink:#E4EBE4;--ink-2:#98A79D;--rule:#24322A;
  --cell:#1B2821;--leaf:#4BAA7F;--on-leaf:#0B140F;--review:#7C6631;--gold:#D5AA4E;--gold-ink:#DDB55E;
  --emerald-ink:#7FCFA6;--cover:#174D3B;--on-cover:#EEF3EC;--on-cover-2:#A9C2B4;--gold-hi:#E7C470;--on-gold:#1B261E;
  --cover-field:rgba(255,255,255,.08);--cetvel:rgba(231,196,112,.5);--cetvel-2:rgba(231,196,112,.2);
  --danger:#E5806B;--on-danger:#1F0E0A;--scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;font-variant-numeric:lining-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.has-sheet{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p,ul,figure{margin:0}
.wrap{width:100%;max-width:46rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header + tabs */
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:1.1rem .4rem}
.brand{display:flex;align-items:baseline;gap:.65rem;min-width:0;flex-wrap:wrap}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;letter-spacing:-.01em;color:var(--emerald-ink)}
.mchip{font-size:.8rem;font-weight:500;color:var(--gold-ink);border:1px solid var(--rule);border-radius:999px;padding:.08rem .6rem;white-space:nowrap}
.tabs{display:flex;gap:.2rem}
.tab{display:flex;align-items:center;gap:.45rem;border:0;background:none;color:var(--ink-2);font-weight:500;font-size:.95rem;border-radius:999px;padding:.45rem .85rem}
.tab svg{width:1.2rem;height:1.2rem;flex:none}
.tab[aria-current="page"]{color:var(--emerald-ink);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule)}
.tab[aria-current="page"] svg{color:var(--gold)}
@media (max-width:759px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;justify-content:space-around;background:var(--sheet);border-top:1px solid var(--rule);
    padding:.3rem max(16px,env(safe-area-inset-right,0px)) calc(.3rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .tab{flex:1;flex-direction:column;gap:.1rem;font-size:.76rem;padding:.35rem .4rem;border-radius:12px}
  .tab[aria-current="page"]{background:none;box-shadow:none}
}
.view{display:flex;flex-direction:column;gap:1.6rem;padding-block:.6rem 2.5rem}
@media (max-width:759px){.view{padding-bottom:calc(6rem + env(safe-area-inset-bottom,0px))}}

/* shared bits */
.label{font-family:var(--f-body);font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.block{display:flex;flex-direction:column;gap:.65rem;min-width:0}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.empty,.hint,.note{color:var(--ink-2);font-size:.93rem;max-width:62ch}
.banner{border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:.6rem .9rem;font-size:.92rem;color:var(--ink-2)}
.err{color:var(--danger);font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:2.75rem;padding:.55rem 1.15rem;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:.98rem;line-height:1.2;text-align:center}
.btn-gold{background:var(--gold-hi);color:var(--on-gold)}
.btn-primary{background:var(--cover);color:var(--on-cover)}
.btn-line{background:var(--sheet);border-color:var(--rule);color:var(--ink)}
.btn-ghost{background:transparent;border-color:var(--cetvel);color:var(--on-cover)}
.btn-danger{background:var(--danger);color:var(--on-danger)}
.btn-wide{width:100%}
.danger-line{color:var(--danger)}
.linkish{background:none;border:0;padding:.25rem 0;font-weight:500;color:var(--gold-hi);text-decoration:underline;text-underline-offset:3px;text-align:left}
.linkish.on-paper{color:var(--gold-ink)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.84rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:.4rem}
.legend span::before{content:"";width:.72rem;height:.72rem;border-radius:2px;background:var(--sw);flex:none}

/* today */
.dateline{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;color:var(--ink-2);font-size:.95rem}
.dayno{font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--gold-ink);white-space:nowrap}
.cover{position:relative;isolation:isolate;display:flex;flex-direction:column;gap:.55rem;background:var(--cover);color:var(--on-cover);border-radius:16px;padding:1.45rem 1.45rem 1.35rem;box-shadow:var(--shadow)}
.cover::before,.cover::after{content:"";position:absolute;pointer-events:none;z-index:-1}
.cover::before{inset:7px;border:1px solid var(--cetvel);border-radius:11px}
.cover::after{inset:10px;border:1px solid var(--cetvel-2);border-radius:8px}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gold-hi)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.9rem,12vw,3.8rem);line-height:1;letter-spacing:-.01em;overflow-wrap:anywhere}
.big .unit{font-size:.42em;font-weight:700;color:var(--gold-hi);margin-right:.2em;vertical-align:.4em}
.big-word{font-size:clamp(2.2rem,9vw,3rem)}
.cover-sub{color:var(--on-cover-2);font-size:1rem}
.cover-act{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.35rem}
.ck{width:1.15rem;height:1.15rem;border-radius:50%;background:var(--gold-hi);position:relative;flex:none}
.ck::after{content:"";position:absolute;left:.39rem;top:.2rem;width:.3rem;height:.58rem;border:solid var(--on-gold);border-width:0 2px 2px 0;transform:rotate(45deg)}
.undo{color:var(--gold-hi);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.sep{color:var(--on-cover-2);font-weight:400}
.cover-next{margin-top:.3rem;padding-top:.7rem;border-top:1px solid var(--cetvel-2);color:var(--on-cover-2);font-size:.93rem}
.sure-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.ar{font-family:var(--f-arabic);font-size:2.1rem;line-height:1.3;color:var(--gold-hi)}
.meter{height:.45rem;border-radius:99px;background:var(--cover-field);overflow:hidden;margin-top:.35rem}
.meter>span{display:block;height:100%;background:var(--gold-hi);border-radius:inherit}
.meter-cap{font-size:.9rem;color:var(--on-cover-2)}
.cover-label{margin-top:.5rem;font-weight:500}
.stepper{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.step{width:2.75rem;height:2.75rem;border-radius:50%;border:1px solid var(--cetvel);background:var(--cover-field);color:var(--on-cover);font-size:1.35rem;line-height:1;display:grid;place-items:center}
.step-in{width:5.2rem;min-height:2.75rem;border-radius:12px;border:1px solid var(--cetvel);background:var(--cover-field);color:var(--on-cover);text-align:center;font-weight:700;font-size:1.15rem;padding:.3rem .4rem}
.cover-links{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem}
.entries{margin-top:.3rem;padding-top:.7rem;border-top:1px solid var(--cetvel-2);display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem .9rem;font-size:.93rem;color:var(--on-cover-2)}
.entries b{color:var(--on-cover);font-weight:500}
.items{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.95rem;width:100%;padding:.85rem .1rem;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left}
.tick{width:1.65rem;height:1.65rem;border-radius:50%;border:2px solid var(--ink-2);position:relative;flex:none;transition:background .15s,border-color .15s}
.item.is-done .tick{background:var(--leaf);border-color:var(--leaf)}
.item.is-done .tick::after{content:"";position:absolute;left:.47rem;top:.2rem;width:.36rem;height:.7rem;border:solid var(--on-leaf);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.item-body{display:flex;flex-direction:column;min-width:0}
.item-tag{font-size:.72rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--gold-ink)}
.item-main{font-family:var(--f-display);font-weight:700;font-size:1.3rem;line-height:1.2;overflow-wrap:anywhere}
.item-sub{font-size:.92rem;color:var(--ink-2)}
.item.is-done .item-main{color:var(--ink-2)}
.totals{font-size:.93rem;color:var(--ink-2)}
.totals b{color:var(--ink);font-weight:700}

/* progress */
.hero{display:flex;flex-direction:column;gap:.45rem}
.pct{font-family:var(--f-display);font-weight:800;font-size:clamp(3.6rem,17vw,5.4rem);line-height:.92;letter-spacing:-.02em;color:var(--emerald-ink)}
.pct-sub{color:var(--ink-2)}
.pct-sub b{color:var(--ink)}
.bar{height:.5rem;border-radius:99px;background:var(--cell);overflow:hidden}
.bar>span{display:block;height:100%;min-width:3px;background:var(--leaf);border-radius:inherit}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:1rem;border-top:1px solid var(--rule)}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{display:flex;flex-direction:column;gap:.1rem;padding:.8rem 0;border-bottom:1px solid var(--rule);min-width:0}
.stat-l{font-size:.72rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2)}
.stat-v{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.15;font-variant-numeric:lining-nums tabular-nums}
.stat-s{font-size:.84rem;color:var(--ink-2)}
.map-grid{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:.4rem;row-gap:.3rem}
.map-y{display:flex;flex-direction:column;justify-content:space-between;font-size:.7rem;line-height:1;color:var(--ink-2);text-align:right;padding-block:1px}
.map,.map-x{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:2px}
.mcol{display:grid;grid-template-rows:repeat(20,auto);gap:2px;padding:0;border:0;background:none;border-radius:3px;min-width:0}
.mcol i{display:block;aspect-ratio:1;border-radius:1.5px;background:var(--cell)}
.mcol i.m{background:var(--leaf)}
.mcol i.r{background:var(--review)}
.mcol i.n{background:var(--gold)}
.mcol:hover i{opacity:.82}
.map-x{font-size:.7rem;color:var(--ink-2);text-align:center;font-variant-numeric:tabular-nums}
.map-x span{overflow:visible;white-space:nowrap}
@media (max-width:420px){.map,.map-x,.mcol{gap:1px}}
.sgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
@media (min-width:640px){.sgrid{grid-template-columns:repeat(19,minmax(0,1fr))}}
.stile{position:relative;aspect-ratio:1;display:grid;place-items:center;padding:0;border:0;border-radius:4px;background:var(--cell);overflow:hidden;font-size:.68rem;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:0}
.stile>span{position:absolute;left:0;right:0;bottom:0;height:var(--h);background:var(--leaf)}
.stile>b{position:relative;font-weight:500}
.stile.done{color:var(--on-leaf)}
.stile.r>span{background:var(--review)}
.stile.r{color:var(--ink)}
.stile.n{box-shadow:inset 0 0 0 2px var(--gold);color:var(--ink)}
.act{display:grid;grid-template-columns:auto repeat(12,minmax(0,1fr));gap:3px;max-width:27rem;align-items:center}
.act .am,.act .ad{font-size:.68rem;color:var(--ink-2);white-space:nowrap;line-height:1}
.act .ad{padding-right:.3rem}
.ac{display:block;aspect-ratio:1;border-radius:3px;background:var(--cell)}
.ac.e{background:var(--leaf)}
.ac.t{background:var(--review)}
.ac.f{visibility:hidden}
.ac.now{box-shadow:0 0 0 1.5px var(--gold)}
.hist{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.hrow{display:grid;grid-template-columns:6.2rem minmax(0,1fr) auto;gap:.8rem;align-items:baseline;padding:.6rem 0;border-bottom:1px solid var(--rule);font-size:.93rem}
.hdate{color:var(--ink-2);white-space:nowrap}
.hnew{font-weight:500;overflow-wrap:anywhere;min-width:0}
.hrev{color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}

/* settings */
.set-sec{display:flex;flex-direction:column;gap:.8rem;padding-top:1.15rem;border-top:1px solid var(--rule)}
.set-row{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:.8rem 1.5rem}
.set-main{flex:1 1 18rem;min-width:0}
.set-title{font-family:var(--f-display);font-weight:700;font-size:1.4rem;line-height:1.2}
.set-desc{color:var(--ink-2);font-size:.95rem;max-width:62ch}
.field{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.field>label,.flabel{font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg button{min-height:2.5rem;padding:.4rem .9rem;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:500}
.seg button[aria-checked="true"]{background:var(--cover);border-color:var(--cover);color:var(--on-cover)}
.inp{width:8rem;min-height:2.75rem;padding:.5rem .75rem;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);font-weight:700;font-size:1.05rem}
.ta{width:100%;padding:.6rem .75rem;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);font-size:.85rem;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.rules{padding-left:1.15rem;display:flex;flex-direction:column;gap:.35rem;color:var(--ink-2);max-width:62ch}
.confirm{display:flex;flex-direction:column;gap:.7rem;padding:.9rem 1rem;border:1px solid var(--rule);border-radius:14px;background:var(--sheet)}

/* onboarding */
.onb{display:grid;gap:1.8rem;padding-block:2.2rem 3rem}
@media (min-width:880px){.onb{max-width:66rem;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:3.5rem;align-items:start;padding-top:3.5rem}}
.onb-a,.onb-b{display:flex;flex-direction:column;gap:1rem;min-width:0}
.onb-title{font-family:var(--f-display);font-weight:800;font-size:clamp(3.2rem,15vw,5rem);line-height:.92;letter-spacing:-.02em;color:var(--emerald-ink)}
.onb-lede{font-size:1.2rem;color:var(--ink);max-width:30ch}
.facts{font-size:.8rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gold-ink)}
.q{font-family:var(--f-display);font-weight:700;font-size:1.55rem;line-height:1.2}
.demo{display:flex;flex-direction:column;gap:.6rem;min-width:0}
.demo canvas{display:block;width:100%;height:auto}
.demo figcaption{display:flex;flex-direction:column;gap:.35rem;font-size:.9rem;color:var(--ink-2)}
.demo-top b{color:var(--gold-ink);font-family:var(--f-display);font-size:1.05rem}
.methods{display:flex;flex-direction:column;gap:.55rem}
.mopt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.85rem;width:100%;text-align:left;padding:.9rem 1rem;border:1px solid var(--rule);border-radius:14px;background:var(--sheet)}
.mopt .dot{width:1.2rem;height:1.2rem;border-radius:50%;border:2px solid var(--ink-2);margin-top:.22rem;position:relative}
.mopt[aria-checked="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.mopt[aria-checked="true"] .dot{border-color:var(--gold)}
.mopt[aria-checked="true"] .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--gold)}
.mopt b{display:block;font-family:var(--f-display);font-weight:700;font-size:1.22rem;line-height:1.2}
.mopt small{display:block;margin-top:.2rem;font-size:.92rem;line-height:1.45;color:var(--ink-2)}
.loading{display:flex;flex-direction:column;gap:.8rem;padding-block:3rem}
.loading p{color:var(--ink-2)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:100%;max-width:38rem;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:.95rem;background:var(--paper);border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  padding:1.15rem max(16px,env(safe-area-inset-right,0px)) calc(1.3rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet:focus{outline:none}
@media (min-width:760px){.scrim{align-items:center;padding:1.5rem}.sheet{border-radius:20px;padding:1.4rem 1.5rem}}
.sh-head{display:flex;align-items:center;gap:.8rem}
.sh-head>div{flex:1;min-width:0}
.sh-head h2{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.1}
.sh-sub{color:var(--ink-2);font-size:.93rem}
.sh-nav,.sh-x{flex:none;width:2.75rem;height:2.75rem;display:grid;place-items:center;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);font-size:1.4rem;line-height:1}
.ar-lg{font-family:var(--f-arabic);font-size:1.9rem;color:var(--gold-ink);line-height:1.2}
.pgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.45rem}
.pg{display:flex;flex-direction:column;align-items:center;padding:.45rem .2rem;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);min-width:0}
.pg b{font-family:var(--f-display);font-size:1.2rem;line-height:1.15}
.pg small{font-size:.74rem;color:var(--ink-2)}
.pg.on{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.pg.on small{color:var(--on-leaf)}
.sh-actions{display:flex;flex-wrap:wrap;gap:.55rem}
.search{width:100%;min-height:2.85rem;padding:.6rem .9rem;border-radius:12px;border:1px solid var(--rule);background:var(--sheet)}
.slist{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.srow{display:grid;grid-template-columns:2.1rem minmax(0,1fr) auto 3.4rem;gap:.7rem;align-items:center;width:100%;padding:.55rem 0;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left}
.sn{text-align:right;font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.st{min-width:0}

["Talâk","الطلاق",12,28,558],["Tahrîm","التحريم",12,28,560],["Mülk","الملك",30,29,562],["Kalem","القلم",52,29,564],

["Müzzemmil","المزمل",20,29,574],["Müddessir","المدثر",56,29,575],["Kıyâme","القيامة",40,29,577],["İnsân","الإنسان",31,29,578],
["Mürselât","المرسلات",50,29,580],["Nebe'","النبأ",40,30,582],["Nâziât","النازعات",46,30,583],["Abese","عبس",42,30,585],
["Tekvîr","التكوير",29,30,586],["İnfitâr","الانفطار",19,30,587],["Mutaffifîn","المطففين",36,30,587],["İnşikâk","الانشقاق",25,30,589],
["Bürûc","البروج",22,30,590],["Târık","الطارق",17,30,591],["A'lâ","الأعلى",19,30,591],["Gâşiye","الغاشية",26,30,592],
["Fecr","الفجر",30,30,593],["Beled","البلد",20,30,594],["Şems","الشمس",15,30,595],["Leyl","الليل",21,30,595],
["Duhâ","الضحى",11,30,596],["İnşirâh","الشرح",8,30,596],["Tîn","التين",8,30,597],["Alak","العلق",19,30,597],
["Kadir","القدر",5,30,598],["Beyyine","البينة",8,30,598],["Zilzâl","الزلزلة",8,30,599],["Âdiyât","العاديات",11,30,599],
["Kâria","القارعة",11,30,600],["Tekâsür","التكاثر",8,30,600],["Asr","العصر",3,30,601],["Hümeze","الهمزة",9,30,601],
["Fîl","الفيل",5,30,601],["Kureyş","قريش",4,30,602],["Mâûn","الماعون",7,30,602],["Kevser","الكوثر",3,30,602],
["Kâfirûn","الكافرون",6,30,603],["Nasr","النصر",3,30,603],["Tebbet","المسد",5,30,603],["İhlâs","الإخلاص",4,30,604],
["Felak","الفلق",5,30,604],["Nâs","الناس",6,30,604]

const METHOD_KEYS = ["osmanli", "pakistan", "cuz", "sure"];
const PAGES = 600;
const NF1 = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 1 });
const fmt1 = x => NF1.format(x);
const cuzOf = p => Math.ceil(p / 20);
const kOf = p => p - 20 * (Math.ceil(p / 20) - 1);
const cuzFirst = c => 20 * (c - 1) + 1;
const cuzLast = c => 20 * c;
const isMem = (pg, p) => pg.charCodeAt(p - 1) === 49;
function setPages(pg, list, on) {
  if (!list || !list.length) return pg;
  const a = pg.split(""), ch = on ? "1" : "0";
  for (const p of list) if (p >= 1 && p <= PAGES) a[p - 1] = ch;
  return a.join("");
}
function memCount(pg) { let n = 0; for (let i = 0; i < PAGES; i++) if (pg.charCodeAt(i) === 49) n++; return n; }
function cuzMem(pg, c) { let n = 0; for (let p = cuzFirst(c); p <= cuzLast(c); p++) if (isMem(pg, p)) n++; return n; }
function completedCuz(pg) { const r = []; for (let c = 1; c <= 30; c++) if (cuzMem(pg, c) === 20) r.push(c); return r; }
function firstUnmem(pg) { const i = pg.indexOf("0"); return i < 0 ? 0 : i + 1; }
function seq(a, b) { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; }

  const s = Array.from(new Set(list)).sort((x, y) => x - y), out = [];
  for (const p of s) { const l = out[out.length - 1]; if (l && p === l[1] + 1) l[1] = p; else out.push([p, p]); }

const fmtRange = ([a, b]) => (a === b ? String(a) : a + "–" + b);
const fmtPages = rg => "s. " + rg.map(fmtRange).join(", ");
function cuzSpan(rg) { const a = cuzOf(rg[0][0]), b = cuzOf(rg[rg.length - 1][1]); return (a === b ? a : a + "–" + b) + ". cüz"; }
function wholeCuz(rg) { if (rg.length !== 1) return null; const [a, b] = rg[0]; return kOf(a) === 1 && kOf(b) === 20 ? [cuzOf(a), cuzOf(b)] : null; }
function kRange(list) { return toRanges(list.map(kOf)).map(fmtRange).join(", ") + (list.length > 1 ? ". sayfalar" : ". sayfa"); }
function mkItem(kind, tag, main, sub, rg, fx, extra) {
  const it = { kind, tag, main, sub, rg: rg || [], n: rangesCount(rg || []), done: false };
  if (fx) it.fx = fx;
  if (extra) Object.assign(it, extra);
  return it;
}

function defaultState(method, today) {
  return {
    v: 1, method, startedAt: today, pages: "0".repeat(PAGES),
    osm: { ptr: 1, per: 1, h: 1 },
    pak: { per: 1, men: "auto", m: 0 },
    cuz: { post: 0, per: 1 },
    sure: { ay: new Array(114).fill(0), cur: 0, dir: "desc", rev: 5, rp: 0, last: 0 }
  };
}
function normalizeState(o, today) {
  if (!o || typeof o !== "object" || METHOD_KEYS.indexOf(o.method) < 0) return null;
  const d = defaultState(o.method, typeof o.startedAt === "string" ? o.startedAt : today);
  const st = Object.assign({}, d, o);
  st.pages = typeof o.pages === "string" && o.pages.length === PAGES && /^[01]+$/.test(o.pages) ? o.pages : d.pages;
  st.osm = Object.assign({}, d.osm, o.osm || {});
  st.pak = Object.assign({}, d.pak, o.pak || {});
  st.cuz = Object.assign({}, d.cuz, o.cuz || {});
  st.sure = Object.assign({}, d.sure, o.sure || {});
  const ay = Array.isArray(st.sure.ay) ? st.sure.ay : [];
  st.sure.ay = SURAHS.map((s, i) => Math.max(0, Math.min(s[2], Math.floor(Number(ay[i]) || 0))));
  return st;
}

/* ---- Osmanlı Usulü: her cüzün sonundan geriye, 30 cüz sırayla; çiğ + pişmiş ---- */
function osmFind(st) {
  const per = Math.max(1, st.osm.per | 0), ptr = Math.min(30, Math.max(1, st.osm.ptr | 0));
  for (let i = 0; i < 30; i++) {
    const c = ((ptr - 1 + i) % 30) + 1, nw = [];
    for (let p = cuzLast(c); p >= cuzFirst(c) && nw.length < per; p--) if (!isMem(st.pages, p)) nw.push(p);
    if (nw.length) return { c, nw: nw.sort((a, b) => a - b) };
  }
  return null;
}
function planOsmanli(st, extra) {
  const f = osmFind(st);
  if (!f) {
    if (extra) return { items: [], complete: true };
    const h = Math.min(30, Math.max(1, st.osm.h | 0)), rg = [[cuzFirst(h), cuzLast(h)]];
    return { complete: true, items: [mkItem("rev", "Hatim tekrarı", h + ". cüz", fmtPages(rg) + " · 20 sayfa", rg, { ptr: ["osm", "h", (h % 30) + 1] })] };
  }
  const c = f.c, nw = f.nw, nrg = toRanges(nw), last = nw[nw.length - 1];
  const tur = Math.max(1, st.osm.per | 0) === 1 ? " · " + (21 - kOf(nw[0])) + ". tur" : "";
  const items = [mkItem("new", "Çiğ", fmtPages(nrg), c + ". cüz · " + kRange(nw) + tur, nrg, { add: nw, ptr: ["osm", "ptr", (c % 30) + 1] })];
  const pis = [];
  for (let p = last + 1; p <= cuzLast(c); p++) if (isMem(st.pages, p)) pis.push(p);
  if (pis.length) { const prg = toRanges(pis); items.push(mkItem("rev", "Pişmiş", fmtPages(prg), c + ". cüz · " + kRange(pis), prg)); }
  return { items, complete: false };
}

/* ---- Pakistan Usulü: sırayla; sebak + sebki (cüz başından) + menzil (biten cüzler) ---- */
function menzilAmount(st, nDone) {
  if (st.pak.men === "auto") return nDone <= 0 ? 0 : nDone <= 3 ? 5 : nDone <= 7 ? 10 : nDone <= 15 ? 20 : nDone <= 20 ? 30 : 60;
  return Math.max(1, Number(st.pak.men) || 20);
}
function menzilChunk(st, curC) {
  const done = [];
  for (let c = 1; c <= 30; c++) if (c !== curC && cuzMem(st.pages, c) === 20) done.push(c);
  if (!done.length) return null;
  const amt = menzilAmount(st, done.length), sq = [];
  for (const c of done) for (let p = cuzFirst(c); p <= cuzLast(c); p++) sq.push(p);
  let idx = sq.findIndex(p => p >= (st.pak.m | 0));
  if (idx < 0) idx = 0;
  const chunk = sq.slice(idx, idx + amt), next = idx + amt < sq.length ? sq[idx + amt] : sq[0];
  const rg = toRanges(chunk), wc = wholeCuz(rg);
  const main = wc ? (wc[0] === wc[1] ? wc[0] : wc[0] + "–" + wc[1]) + ". cüz" : fmtPages(rg);
  const sub = (wc ? fmtPages(rg) : cuzSpan(rg)) + " · " + chunk.length + " sayfa";
  return { rg, main, sub, next };
}
function planPakistan(st, extra) {
  const per = Math.max(1, st.pak.per | 0), first = firstUnmem(st.pages), items = [];
  let c = 0;
  if (first) {
    c = cuzOf(first);
    const nw = [];
    for (let p = first; p <= cuzLast(c) && nw.length < per && !isMem(st.pages, p); p++) nw.push(p);
    const nrg = toRanges(nw);
    items.push(mkItem("new", "Sebak", fmtPages(nrg), c + ". cüz · " + kRange(nw), nrg, { add: nw }));
    if (!extra) {
      const sb = [];
      for (let p = cuzFirst(c); p < first; p++) if (isMem(st.pages, p)) sb.push(p);
      if (sb.length) { const srg = toRanges(sb); items.push(mkItem("rev", "Sebki", fmtPages(srg), c + ". cüz · baştan " + sb.length + " sayfa", srg)); }
    }
  }
  if (!extra) { const m = menzilChunk(st, c); if (m) items.push(mkItem("rev", "Menzil", m.main, m.sub, m.rg, { ptr: ["pak", "m", m.next] })); }
  return { items, complete: !first };
}

/* ---- Cüz Usulü: sırayla bir sayfa; k. sayfada k cüz geri; 21–30 yan sırada 10'ar sayfa, tersten ---- */
function cuzReview(n, k) {
  const main = n <= 21 ? (n - k >= 1 ? n - k : 0) : 21 - k;
  const m = n - 21;
  let side = null;
  if (m >= 1 && k <= 2 * m) { const b = 2 * m - k + 1; side = [400 + 10 * (b - 1) + 1, 400 + 10 * b]; }
  return { main, side };
}
function cuzItems(n, k, fx) {
  const r = cuzReview(n, k), out = [];
  if (r.main >= 1) { const rg = [[cuzFirst(r.main), cuzLast(r.main)]]; out.push(mkItem("rev", "Ana sıra", r.main + ". cüz", fmtPages(rg) + " · 20 sayfa", rg, fx)); }
  if (r.side) { const rg = [r.side]; out.push(mkItem("rev", "Yan sıra", fmtPages(rg), cuzOf(r.side[0]) + ". cüz · " + (kOf(r.side[0]) === 1 ? "ilk" : "son") + " 10 sayfa", rg)); }

function planCuz(st, extra) {
  const first = firstUnmem(st.pages);
  if (first) {
    const n = cuzOf(first), k = kOf(first);
    return { complete: false, items: [mkItem("new", "Ezber", "s. " + first, n + ". cüz · " + k + ". sayfa", [[first, first]], { add: [first] })].concat(cuzItems(n, k, null)) };

/* ---- Sure Sure: 114 sureden seçerek; ayet ayet ilerleme, sıra tekrarı ---- */
const SW = (function () {
  const n = SURAHS.length, pos = new Array(n + 1), byPage = {};

  Object.keys(byPage).forEach(pg => { const arr = byPage[pg]; arr.forEach((i, r) => { pos[i] = Number(pg) + (r + 1) / (arr.length + 1); }); });

  for (let i = 0; i < n; i++) { w[i] = pos[i + 1] - pos[i]; tot += w[i]; }

  if (!done.length) return null;
  let idx = done.findIndex(s => s > (st.sure.rp | 0));
  if (idx < 0) idx = 0;
  const chunk = []; let w = 0;
  for (let i = 0; i < done.length; i++) { const s = done[(idx + i) % done.length]; chunk.push(s); w += SW[s - 1]; if (w >= budget) break; }
  return { chunk, w, next: chunk[chunk.length - 1] };
}
function sureListText(list) {
  const names = list.map(s => SURAHS[s - 1][0]);
  if (list.length <= 3) return names.join(" · ");
  const consecutive = list.every((s, i) => i === 0 || s === list[i - 1] + 1);
  return consecutive ? names[0] + " – " + names[names.length - 1] : names.slice(0, 3).join(" · ") + " +" + (list.length - 3);
}
function planSure(st, extra) {
  const items = [], complete = sureAllDone(st);
  if (extra) return { items, complete };
  const cur = st.sure.cur;
  let skip = 0;
  if (cur && st.sure.ay[cur - 1] > 0 && !sureDone(st, cur)) {
    const a = st.sure.ay[cur - 1];
    items.push(mkItem("rev", "Yakın tekrar", SURAHS[cur - 1][0], "1–" + a + ". ayetler", [], null, { sr: [cur], w: SW[cur - 1] * a / sureTotal(cur) }));
  } else if (st.sure.last && st.sure.last !== cur && sureDone(st, st.sure.last)) {
    const s = st.sure.last; skip = s;
    items.push(mkItem("rev", "Yakın tekrar", SURAHS[s - 1][0], "Son biten sure · " + sureTotal(s) + " ayet", [], null, { sr: [s], w: SW[s - 1] }));
  }

  if (ch) items.push(mkItem("rev", "Sıra tekrarı", sureListText(ch.chunk), ch.chunk.length + " sure · ≈" + fmt1(ch.w) + " sayfa", [], { ptr: ["sure", "rp", ch.next] }, { sr: ch.chunk, w: ch.w }));

function planLesson(st, extra) {
  const f = { osmanli: planOsmanli, pakistan: planPakistan, cuz: planCuz, sure: planSure }[st.method];
  return f ? f(st, !!extra) : { items: [], complete: false };

// Günün dersleri. Cüz Usulünde günde birden fazla sayfa seçildiyse her sayfa ayrı bir derstir
// ve kendi tekrarını (ana sıra cüzü + varsa yan sıra parçası) getirir.
function planDay(st) {
  const lessons = [planLesson(st, false)];
  if (st.method !== "cuz") return lessons;
  const per = Math.max(1, Math.min(10, st.cuz.per | 0));
  let sim = null;
  for (let i = 1; i < per; i++) {
    const nw = lessons[i - 1].items.find(x => x.kind === "new");
    if (!nw) break;
    if (!sim) sim = JSON.parse(JSON.stringify(st));
    applyFx(sim, JSON.parse(JSON.stringify(nw)));
    const L = planLesson(sim, true);
    if (!L.items.some(x => x.kind === "new")) break;
    lessons.push(L);
  }
  return lessons;
}
function applyFx(st, it) {
  const fx = it.fx;

/* --- örnek gidişat çizimi --- */
const Demo = { raf: 0, gen: null, method: "", canvas: null, frame: null, acc: 0, lastT: 0, hold: 0, colors: null };
function demoColors() { const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim(); return { cell: g("--cell"), mem: g("--leaf"), nw: g("--gold"), rev: g("--review") }; }
function demoStop() { cancelAnimationFrame(Demo.raf); Demo.raf = 0; Demo.canvas = null; }
function demoStart(method) {
  demoStop();
  const cv = document.getElementById("demo");
  if (!cv) return;
  Demo.canvas = cv; Demo.method = method; Demo.colors = demoColors();
  Demo.gen = simulate(method); Demo.frame = Demo.gen.next().value; Demo.acc = 0; Demo.lastT = 0; Demo.hold = 0;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const target = method === "sure" ? 40 : 245;
    for (let i = 1; i < target; i++) { const r = Demo.gen.next(); if (r.done) break; Demo.frame = r.value; }
    demoDraw(); return;
  }
  demoDraw(); Demo.raf = requestAnimationFrame(demoTick);
}
function demoTick(t) {
  if (!Demo.canvas || !Demo.canvas.isConnected) { demoStop(); return; }
  if (!Demo.lastT) Demo.lastT = t;
  const dt = Math.min(120, t - Demo.lastT); Demo.lastT = t;
  if (Demo.hold > 0) {
    Demo.hold -= dt;
    if (Demo.hold <= 0) { Demo.gen = simulate(Demo.method); Demo.frame = Demo.gen.next().value; Demo.acc = 0; demoDraw(); }
  } else {
    Demo.acc += dt * (Demo.method === "sure" ? 7 : 30) / 1000;
    let moved = false;
    while (Demo.acc >= 1) {
      Demo.acc -= 1;
      const r = Demo.gen.next();
      if (r.done) { Demo.hold = 2600; break; }
      Demo.frame = r.value; moved = true;
      if (r.value.done) { Demo.hold = 2600; break; }
    }
    if (moved) demoDraw();
  }
  Demo.raf = requestAnimationFrame(demoTick);
}
function demoDraw() {
  const cv = Demo.canvas, f = Demo.frame;
  if (!cv || !f) return;
  const sure = Demo.method === "sure", cols = sure ? 19 : 30, rows = sure ? 6 : 20;
  const W = cv.clientWidth || (cv.parentElement && cv.parentElement.clientWidth) || 320, gap = W < 420 ? 1.5 : 2;
  const cell = (W - gap * (cols - 1)) / cols, H = Math.round(rows * cell + gap * (rows - 1)), dpr = Math.min(2, window.devicePixelRatio || 1);
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + "px"; }
  const ctx = cv.getContext("2d"), C = Demo.colors, st = f.st, nw = new Set(), rv = new Set(), rad = Math.min(2, cell * 0.2);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  if (!f.done) {
    f.plan.items.forEach(it => { if (sure) (it.sr || []).forEach(s => rv.add(s)); else rangesPages(it.rg).forEach(p => (it.kind === "new" ? nw : rv).add(p)); });
    if (sure && st.sure.cur) nw.add(st.sure.cur);
  }
  const box = (x, y, col) => { ctx.fillStyle = col; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, cell, cell, rad); else ctx.rect(x, y, cell, cell); ctx.fill(); };
  if (sure) for (let s = 1; s <= 114; s++) { const i = s - 1; box((i % cols) * (cell + gap), Math.floor(i / cols) * (cell + gap), nw.has(s) ? C.nw : rv.has(s) ? C.rev : sureDone(st, s) ? C.mem : C.cell); }
  else for (let p = 1; p <= PAGES; p++) box((cuzOf(p) - 1) * (cell + gap), (kOf(p) - 1) * (cell + gap), nw.has(p) ? C.nw : rv.has(p) ? C.rev : isMem(st.pages, p) ? C.mem : C.cell);
  const day = document.getElementById("demo-day");
  if (day) day.textContent = f.done ? "Hafızlık tamam" : NF.format(f.step) + (sure ? ". sure" : ". gün");
}
function refreshDemoColors() { if (Demo.canvas) { Demo.colors = demoColors(); demoDraw(); } }

    case "sure-back": S.ui.sheet.detail = 0; S.ui.detailAy = null; renderSheet(true); return;

      dropIdleToday(); saveState();
      if (S.ui.sheet) closeSheet(); else render();
      toast(SURAHS[s - 1][0] + " suresi seçildi."); return;
    }
    case "open-cuz": openSheet({ type: "cuz", c: +d.c }); return;
    case "cuz-nav": S.ui.sheet.c = Math.max(1, Math.min(30, +d.c)); renderSheet(true); return;
    case "cuz-page": {
      const p = +d.p; st.pages = setPages(st.pages, [p], !isMem(st.pages, p));
      saveState(); render(); renderSheet(); const b = document.querySelector('[data-p="' + p + '"]'); if (b) b.focus(); return;
    }
    case "cuz-all": { const c = +d.c; st.pages = setPages(st.pages, seq(cuzFirst(c), cuzLast(c)), d.on === "1"); saveState(); render(); renderSheet(true); return; }
    case "open-method": openSheet({ type: "method", sel: st.method }); return;
    case "sheet-pick": {
      S.ui.sheet.sel = d.v; const root = $("#sheet-root"); selectOption(root, d.v);
      const btn = root.querySelector("#method-apply"); btn.disabled = d.v === st.method; btn.textContent = d.v === st.method ? "Bu usuldesin" : METHODS[d.v].to;
      root.querySelector("#method-note").textContent = methodNote(st.method, d.v); return;
    }
    case "method-apply": changeMethod(S.ui.sheet.sel); return;
    case "set": {
      const parts = d.k.split("."), v = /^\d+$/.test(d.v) ? Number(d.v) : d.v;
      st[parts[0]][parts[1]] = v;
      if (d.k === "sure.dir" && st.sure.cur && st.sure.ay[st.sure.cur - 1] === 0) st.sure.cur = sureSuggest(st);
      dropIdleToday(); saveState(); render();
      if (/\.per$/.test(d.k) && dayStatus(S.days[S.today])) toast("Yeni ayar yarından geçerli. Bugün için \"Bir ders daha ekle\" düğmesini kullanabilirsin.");
      return;
    }
    case "pos-ask": S.ui.confirm = "pos"; render(); return;
    case "pos-apply": applyPos(); return;
    case "confirm-cancel": S.ui.confirm = null; render(); return;
    case "reset-ask": S.ui.confirm = "reset"; render(); return;
    case "reset-apply": resetAll(); return;
    case "backup-copy": {
      const txt = backupJson();
      if (APP && window.HafizlikAndroid && window.HafizlikAndroid.kopyala) {
        try { if (window.HafizlikAndroid.kopyala(txt)) { S.ui.backupText = ""; render(); toast("Yedek panoya kopyalandı. Güvenli bir yere yapıştırıp sakla."); return; } } catch (err) {}
      }
      try {
        navigator.clipboard.writeText(txt).then(() => { S.ui.backupText = ""; render(); toast("Yedek panoya kopyalandı."); }, () => { S.ui.backupText = txt; render(); const t = $("#backup-out"); if (t) t.select(); });
      } catch (err) { S.ui.backupText = txt; render(); const t = $("#backup-out"); if (t) t.select(); }
      return;
    }
    case "restore-open": S.ui.restoreOpen = true; S.ui.restoreErr = ""; render(); const ta = $("#restore-in"); if (ta) ta.focus(); return;
    case "restore-close": S.ui.restoreOpen = false; S.ui.restoreText = ""; S.ui.restoreErr = ""; S.ui.confirm = null; render(); return;
    case "restore-ask": if (!S.ui.restoreText.trim()) { S.ui.restoreErr = "Önce yedek metnini yapıştır."; render(); return; } S.ui.confirm = "restore"; S.ui.restoreErr = ""; render(); return;
    case "restore-apply": {
      const err = restoreBackup(S.ui.restoreText);
      S.ui.confirm = null;
      if (err) { S.ui.restoreErr = err; render(); return; }
      S.ui.restoreOpen = false; S.ui.restoreText = ""; S.ui.restoreErr = ""; render(); toast("Yedek geri yüklendi."); return;
    }
    case "hist-more": S.ui.histMore += 30; render(); return;
  }
});
document.addEventListener("input", e => {
  const el = e.target.closest("[data-in]");
  if (!el) return;
  switch (el.dataset.in) {
    case "sure-ay": S.ui.ayInput = parseInt(el.value, 10); break;
    case "sure-detail-ay": S.ui.detailAy = parseInt(el.value, 10); break;
    case "sure-search": S.ui.sheet.q = el.value; $("#slist").innerHTML = sureListHtml(el.value); break;
    case "pos-tur": S.ui.pos.tur = el.value; $("#pos-exp").textContent = posExplain(); break;
    case "pos-cuz": S.ui.pos.cuz = el.value; $("#pos-exp").textContent = posExplain(); break;
    case "pos-page": S.ui.pos.page = el.value; $("#pos-exp").textContent = posExplain(); break;
    case "restore-text": S.ui.restoreText = el.value; break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.ui.sheet) { closeSheet(); return; }
  if (e.key === "Enter" && e.target && e.target.id === "sure-ay") { e.preventDefault(); saveSureEntry(parseInt(e.target.value, 10)); }
});
window.addEventListener("resize", () => { if (Demo.canvas) demoDraw(); });
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refreshDemoColors); } catch (e) {}
try { new MutationObserver(refreshDemoColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] }); } catch (e) {}
function checkDay() { const t = dkey(new Date()); if (t !== S.today) { S.today = t; S.ui.ayInput = null; if (S.mode === "ready" && S.state) render(); } }
setInterval(checkDay, 60000);
document.addEventListener("visibilitychange", () => { if (document.hidden) flushLocal(); else checkDay(); });
window.addEventListener("pagehide", flushLocal);
// Android uygulaması için: arka plana geçerken kaydet, geri dönünce günü kontrol et, geri tuşunu yönet.
window.hafizlikFlush = flushLocal;
window.hafizlikResume = checkDay;
window.hafizlikBack = function () {
  if (S.ui.sheet) { closeSheet(); return true; }
  if (S.ui.confirm) { S.ui.confirm = null; render(); return true; }
  if (S.state && S.ui.tab !== "bugun") { S.ui.tab = "bugun"; render(); window.scrollTo(0, 0); return true; }
  return false;
};

/* ---------------- açılış ---------------- */
async function boot() {
  try { document.documentElement.lang = "tr"; } catch (e) {}
  render();
  let db = null, user = null, uid = null;
  try { if (window.claude && typeof window.claude.use === "function") { const r = await Promise.all([window.claude.use("db"), window.claude.use("user")]); db = r[0]; user = r[1]; } } catch (e) {}
  if (db && user) { try { uid = await user.id(); } catch (e) {} }
  if (db && uid) startDb(db, uid); else startLocal("local");
}
boot();
})();
</script>
</body>
</html>
