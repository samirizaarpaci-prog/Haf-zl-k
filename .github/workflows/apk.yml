# Hafızlık — Android APK'sını GitHub'ın bilgisayarlarında derler.
# "main" dalına her yüklemede (ya da Actions sekmesinden "Run workflow" ile) çalışır.
# Sonuç: Releases sayfasında telefona kurulacak APK. Hata olursa kaydı Issues'a yazılır.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Derle
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease -PsurumKodu=$GITHUB_RUN_NUMBER 2>&1 | tee build.log

      - name: APK'yı adlandır
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Hafizlik-1.0.$GITHUB_RUN_NUMBER.apk"
          ls -la out | tee -a build.log

      - name: Paketi sakla
        uses: actions/upload-artifact@v4
        with:
          name: hafizlik-apk
          path: out/*.apk

      - name: Sürüm sayfasına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.$GITHUB_RUN_NUMBER"
          gh release create "v$V" out/*.apk --title "Hafızlık $V" \
            --notes "Telefona kurmak için **Hafizlik-$V.apk** dosyasına dokun, indir ve aç. Yeni sürüm eskisinin üstüne kurulur; ilerlemen silinmez."

      - name: Hata olursa kaydını bırak
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          { echo "Derleme $GITHUB_RUN_NUMBER başarısız oldu. Kaydın son kısmı:"; echo; echo '```'; tail -c 60000 build.log; echo '```'; } > issue.md
          gh issue create --title "Derleme hatası #$GITHUB_RUN_NUMBER" --body-file issue.md
